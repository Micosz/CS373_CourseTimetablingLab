name: Engine checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_parity:
        description: Also re-run all 240 runs of experiments/final with the C# engine and require the committed results
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  python:
    # Analysis and dataset tooling only (engine/analyze.py, dataset variants); no solver is tested here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s engine/tests -v

  dotnet:
    # The C# engine is the only solver in the repository and produced every committed result.
    # The fast tests check its RNG against CPython vectors and its validators against fixtures made
    # with engine/solution_validator.py and engine/input_validation.py; the slow job checks that the
    # committed results of experiments/final reproduce. Before the Python solver was removed, 16 runs
    # of experiments/final were cross-checked against it by hand; that check is not part of CI.
    # Linux and Windows use different C math libraries, so both run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fast tests (RNG, decoder, validators, runner, CLI, spot parity)
        run: dotnet test dotnet/Timetabling.sln --filter "Category!=Slow"
      - name: Full 240-run reproduction of experiments/final
        if: github.event_name == 'workflow_dispatch' && inputs.full_parity
        run: dotnet test dotnet/Timetabling.sln --filter "Category=Slow"
