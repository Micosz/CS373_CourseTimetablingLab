<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d"><title id="t">Lab ไม่จำเป็น (ชม.) ต่อรัน</title><desc id="d">Box plot ของ Lab ไม่จำเป็น (ชม.) ต่อรัน แยกตามวิธี</desc><style>text{font-family:'Noto Sans Thai','Leelawadee UI','Sarabun',Tahoma,system-ui,sans-serif;fill:var(--ink)}:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--axis:#a3a29c}.s-greedy{fill:#8a8984;stroke:#8a8984}.s-hc{fill:#2a78d6;stroke:#2a78d6}.s-sa{fill:#eb6834;stroke:#eb6834}.s-ga{fill:#1baf7a;stroke:#1baf7a}.bg{fill:var(--surface)}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.muted{fill:var(--ink2)}.line{fill:none;stroke-width:2}.band{stroke:none;opacity:.18}.ref{fill:none;stroke-width:2;stroke-dasharray:6 4}@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#33332f;--axis:#6b6a64}.s-greedy{fill:#9a9992;stroke:#9a9992}.s-hc{fill:#3987e5;stroke:#3987e5}.s-sa{fill:#d95926;stroke:#d95926}.s-ga{fill:#199e70;stroke:#199e70}}</style><rect class="bg" width="720" height="420"/><line class="grid" x1="80" x2="680" y1="350.0" y2="350.0"/><text class="muted" x="72" y="354.0" font-size="12" text-anchor="end">0</text><line class="grid" x1="80" x2="680" y1="277.5" y2="277.5"/><text class="muted" x="72" y="281.5" font-size="12" text-anchor="end">50</text><line class="grid" x1="80" x2="680" y1="205.0" y2="205.0"/><text class="muted" x="72" y="209.0" font-size="12" text-anchor="end">100</text><line class="grid" x1="80" x2="680" y1="132.5" y2="132.5"/><text class="muted" x="72" y="136.5" font-size="12" text-anchor="end">150</text><line class="grid" x1="80" x2="680" y1="60.0" y2="60.0"/><text class="muted" x="72" y="64.0" font-size="12" text-anchor="end">200</text><line class="axis" x1="80" x2="680" y1="350" y2="350"/><text x="30" y="38" font-size="13" font-weight="600">Lab ไม่จำเป็น (ชม.) ต่อรัน · โหมด weekly</text><text class="muted" x="155.0" y="3